<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Live Poker - Theo's Casino</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --bg1:#071a33;
      --bg2:#051224;
      --card: rgba(255,255,255,.06);
      --cardBorder: rgba(255,255,255,.10);
      --text:#eaf2ff;
      --muted: rgba(234,242,255,.70);
      --btnWhite:#ffffff;
      --btnText:#0b1a2f;
      --line: rgba(255,255,255,.12);
      --felt:#0d5f46;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 560px at 50% -120px, rgba(255,255,255,.12), transparent 60%),
        radial-gradient(700px 420px at 72% 18%, rgba(26,188,156,.16), transparent 65%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    .top-nav{
      position: sticky;
      top: 0;
      z-index: 20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      width:100%;
      padding:16px max(24px, calc((100vw - 1500px) / 2 + 24px));
      background:rgba(8,20,37,.88);
      backdrop-filter:blur(12px);
    }

    .brand{
      color:#ffffff;
      font-weight:400;
      font-family: Arial, sans-serif;
      text-decoration:none;
      white-space:nowrap;
    }

    .nav-links{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }

    .nav-links a{
      color:var(--muted);
      text-decoration:none;
      font-size:14px;
      font-weight:800;
      padding:8px 10px;
      border-radius:10px;
    }

    .account-name{
      color:var(--muted);
      font-size:14px;
      font-weight:800;
      padding:8px 10px;
      border-radius:10px;
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:var(--text);
      background:rgba(255,255,255,.09);
    }

    .page{
      max-width:1120px;
      margin:0 auto;
      padding:28px 18px 52px;
    }

    .title{
      text-align:center;
      color:#ffffff;
      font-size:56px;
      font-weight:900;
      letter-spacing:.5px;
      margin:12px 0 18px;
      text-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .grid{
      display:grid;
      grid-template-columns: 330px 1fr;
      gap:18px;
      align-items:start;
    }

    .panel,
    .poker-table{
      background:var(--card);
      border:1px solid var(--cardBorder);
      border-radius:18px;
      padding:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
      color:var(--text);
    }

    .poker-table{
      min-height:430px;
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,.08), transparent 65%),
        linear-gradient(145deg, #0a6b4d, var(--felt));
      border: 8px solid rgba(80, 45, 26, .75);
    }

    .panel h2,
    .poker-table h2{
      margin:0 0 12px;
      font-size:22px;
      color:#ffffff;
    }

    .muted{ color:var(--muted); font-weight:700; }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:12px;
    }

    button, .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:none;
      border-radius:12px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:800;
      font-family:inherit;
      font-size:14px;
      background:var(--btnWhite);
      color:var(--btnText);
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      text-decoration:none;
      outline:none !important;
    }

    button:active, .btn:active{ transform:translateY(1px); }

    input{
      width:110px;
      padding:10px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(15,23,42,.55);
      color:var(--text);
      outline:none;
      font-weight:800;
    }

    .stat-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:12px 0;
    }

    .stat{
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(15,23,42,.38);
      color:var(--text);
    }

    .stat strong{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-bottom:4px;
    }

    .cards{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin:18px 0;
      min-height:74px;
    }

    .playing-card{
      width:54px;
      height:74px;
      border-radius:10px;
      background:#ffffff;
      color:#101828;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      box-shadow:0 8px 18px rgba(0,0,0,.24);
    }

    .playing-card.hidden{
      color:#ffffff;
      background:repeating-linear-gradient(45deg, #1d4ed8, #1d4ed8 8px, #173b9a 8px, #173b9a 16px);
    }

    .players{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
      gap:12px;
      margin-top:18px;
    }

    .player{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      background:rgba(15,23,42,.42);
      color:var(--text);
    }

    .player.turn{
      border-color:rgba(255,255,255,.72);
      box-shadow:0 0 0 2px rgba(255,255,255,.12);
    }

    .player.folded{ opacity:.55; }

    .message{
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(15,23,42,.42);
      color:var(--muted);
      font-weight:700;
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns:1fr; }
      .title{ font-size:44px; }
      .top-nav{ align-items:flex-start; flex-direction:column; }
      .nav-links{ justify-content:flex-start; }
    }
  </style>
  <link href="/css/site-nav.css" rel="stylesheet">
</head>

<body>
  <nav class="top-nav" aria-label="Casino navigation">
    <a class="brand" href="/">Theo's Casino</a>
    <div class="nav-links">
      <a href="/wallet">Wallet</a>
      <a href="/blackjack">Blackjack</a>
      <a href="/slots">Slots</a>
      <a href="/roulette">Roulette</a>
      <a class="active" href="/poker">Poker</a>
      <a sec:authorize="isAnonymous()" href="/log-in">Log-in</a>
      <a sec:authorize="isAnonymous()" href="/signup">Sign-up</a>
      <span sec:authorize="isAuthenticated()" class="account-name">
        <span sec:authentication="name"></span>
      </span>
      <a sec:authorize="isAuthenticated()" href="/logout">Logout</a>
    </div>
  </nav>

  <main class="page">
    <h1 class="title">Live Poker</h1>

    <section class="grid">
      <aside class="panel">
        <h2>Table Controls</h2>
        <p class="muted">Join the shared table, start a hand, then take turns checking, calling, raising, or folding.</p>

        <div class="actions">
          <button type="button" onclick="postAction('/api/poker/join')">Join Table</button>
          <button type="button" onclick="postAction('/api/poker/start')">Start Hand</button>
          <button type="button" onclick="postAction('/api/poker/leave')">Leave</button>
        </div>

        <div class="actions">
          <button type="button" onclick="postAction('/api/poker/check')">Check</button>
          <button type="button" onclick="postAction('/api/poker/call')">Call</button>
          <button type="button" onclick="postAction('/api/poker/fold')">Fold</button>
        </div>

        <div class="actions">
          <input id="raiseAmount" type="number" min="1" step="1" value="10" aria-label="Raise amount">
          <button type="button" onclick="raiseBet()">Raise</button>
        </div>

        <div class="message" id="message">Loading table...</div>
      </aside>

      <section class="poker-table">
        <h2>Community Cards</h2>
        <div id="communityCards" class="cards"></div>

        <div class="stat-grid">
          <div class="stat">
            <strong>Pot</strong>
            <span id="pot">$0</span>
          </div>
          <div class="stat">
            <strong>Turn</strong>
            <span id="turn">Waiting</span>
          </div>
        </div>

        <h2>Players</h2>
        <div id="players" class="players"></div>
      </section>
    </section>
  </main>

  <script>
    function cardHtml(card) {
      const hidden = card === "Hidden";
      return `<span class="playing-card ${hidden ? "hidden" : ""}">${hidden ? "" : card}</span>`;
    }

    async function loadState() {
      const res = await fetch("/api/poker", { cache: "no-store" });
      if (!res.ok) {
        document.getElementById("message").textContent = "Log in to join the poker table.";
        return;
      }

      const data = await res.json();
      renderState(data);
    }

    async function postAction(url) {
      const res = await fetch(url, { method: "POST" });
      if (res.ok) {
        renderState(await res.json());
      }
    }

    async function raiseBet() {
      const amount = Number(document.getElementById("raiseAmount").value || 10);
      const res = await fetch(`/api/poker/raise?amount=${encodeURIComponent(amount)}`, { method: "POST" });
      if (res.ok) {
        renderState(await res.json());
      }
    }

    function renderState(data) {
      document.getElementById("pot").textContent = `$${data.pot}`;
      document.getElementById("turn").textContent = data.currentTurn || "Waiting";
      document.getElementById("message").textContent = data.message;

      const community = data.communityCards.length
        ? data.communityCards.map(cardHtml).join("")
        : `<span class="muted">Cards appear here after the hand starts.</span>`;
      document.getElementById("communityCards").innerHTML = community;

      const players = data.players.length
        ? data.players.map(player => `
            <article class="player ${player.username === data.currentTurn ? "turn" : ""} ${player.folded ? "folded" : ""}">
              <strong>${player.username}</strong>
              <div class="muted">Bet: $${player.currentBet}${player.folded ? " | Folded" : ""}</div>
              <div class="cards">${player.cards.map(cardHtml).join("")}</div>
            </article>
          `).join("")
        : `<p class="muted">No players have joined yet.</p>`;
      document.getElementById("players").innerHTML = players;
    }

    loadState();
    setInterval(loadState, 1500);
  </script>
</body>
</html>
