<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Log-in - Theo's Casino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg1: #081425;
            --bg2: #0b1a2f;
            --card: #1f2a3d;
            --card2: #23324a;
            --text: #ffffff;
            --accent: #8ab4ff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(
                1200px 600px at 50% 0%,
                #132a4f 0%,
                var(--bg2) 55%,
                var(--bg1) 100%
            );
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .top-nav{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
            width:100%;
            padding:16px max(24px, calc((100vw - 1500px) / 2 + 24px));
            background:rgba(8,20,37,.88);
            backdrop-filter:blur(12px);
        }

        .brand{
            color:#ffffff;
            font-weight:400;
            text-decoration:none;
            white-space:nowrap;
        }

        .nav-links{
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:8px;
            flex-wrap:wrap;
        }

        .nav-links a{
            color:rgba(234,242,255,.70);
            text-decoration:none;
            font-size:14px;
            font-weight:800;
            padding:8px 10px;
            border-radius:10px;
        }

        .account-name{
            color:rgba(234,242,255,.70);
            font-size:14px;
            font-weight:800;
            padding:8px 10px;
            border-radius:10px;
        }

        .nav-links a:hover,
        .nav-links a.active{
            color:#ffffff;
            background:rgba(255,255,255,.09);
            text-decoration:none;
        }

        .auth-page {
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:32px 18px;
        }

        .login-card {
            width: 380px;
            padding: 40px;
            border-radius: 20px;
            background: linear-gradient(180deg, var(--card2), var(--card));
            box-shadow: 0 20px 50px rgba(0,0,0,.4);
            text-align: center;
            position: relative;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        input {
            width: 85%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            text-align: center;
        }

        input::placeholder {
            text-align: center;
        }

        button {
            width: 85%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            background: white;
            color: #0b1a2f;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .error {
            color: #ff6b6b;
            margin-bottom: 15px;
        }

        .back-home {
            position: absolute;
            top: 18px;
            left: 20px;
            font-size: 14px;
            color: var(--accent);
            text-decoration: none;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .top-nav{
                align-items:flex-start;
                flex-direction:column;
            }

            .nav-links{
                justify-content:flex-start;
            }
        }
    </style>
    <link href="/css/site-nav.css" rel="stylesheet">
</head>
<body>
<nav class="top-nav" aria-label="Casino navigation">
    <a class="brand" href="/">Theo's Casino</a>
    <div class="nav-links">
        <a href="/wallet">Wallet</a>
        <a href="/blackjack">Blackjack</a>
        <a href="/slots">Slots</a>
        <a href="/roulette">Roulette</a>
        <a href="/poker">Poker</a>
        <a class="active" href="/log-in">Log-in</a>
        <a href="/signup">Sign-up</a>
        <span sec:authorize="isAuthenticated()" class="account-name">
            <span sec:authentication="name"></span>
        </span>
        <a sec:authorize="isAuthenticated()" href="/logout">Logout</a>
    </div>
</nav>
<main class="auth-page">
<div class="login-card">

    <a class="back-home" href="/"> Back to Home</a>

    <h1>Log-in</h1>

    <div sec:authorize="isAuthenticated()" style="position:absolute; top:20px; right:20px;">
        Welcome, <span sec:authentication="name"></span>!
        <a href="/logout">Logout</a>
    </div>
    
    <div sec:authorize="isAnonymous()" style="position:absolute; top:20px; right:20px;">
    </div>    

    <div class="error" th:if="${param.error}">
        Invalid username or password.
    </div>
    
    <div class="error" style="color:#8affb1;" th:if="${param.logout}">
        You have been logged out.
    </div>    

    <div class="error" style="color:#8affb1;" th:if="${param.signupSuccess}">
        Account created. Log in below.
    </div>

    <form method="post" action="/log-in">
        <input type="text" name="username" placeholder="Username" autocomplete="username" required />
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit">Log-in</button>
    </form>

    <p style="margin-top:20px;">
        <a href="/signup">Don't have an account? Sign up.</a>
    </p>

</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
